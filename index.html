<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>奧修禪卡 · 覺察</title>
    <style>
        :root { --zen-bg: #fdfaf5; --zen-accent: #8e7d5f; }
        body { font-family: sans-serif; background: var(--zen-bg); display: flex; justify-content: center; padding: 20px; }
        .app-container { width: 100%; max-width: 400px; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); text-align: center; }
        h2 { color: var(--zen-accent); font-weight: 300; letter-spacing: 3px; }
        textarea, input { width: 100%; border: 1px solid #eee; border-radius: 10px; padding: 15px; margin-bottom: 20px; box-sizing: border-box; font-size: 1rem; background: #fafafa; }
        button { width: 100%; padding: 16px; border: none; border-radius: 10px; background: var(--zen-accent); color: white; font-size: 1.1rem; cursor: pointer; }
        .hint { font-size: 0.8rem; color: #888; margin-top: 15px; line-height: 1.5; }
    </style>
</head>
<body>

<div class="app-container">
    <h2>禪 · 覺察</h2>
    <textarea id="question" rows="3" placeholder="請輸入你的提問..."></textarea>
    <input type="text" id="cards" placeholder="輸入牌名（如：空, 勇氣）">
    
    <button onclick="copyAndGo()">一鍵複製並開啟解讀</button>

    <p class="hint">
        點擊後會「自動複製」解讀指令，<br>
        跳轉後請在對話框「貼上」即可開始。
    </p>
</div>

<script>
    function copyAndGo() {
        const q = document.getElementById('question').value.trim();
        const c = document.getElementById('cards').value.trim();
        
        if(!q || !c) { alert("請填寫完整"); return; }

        // 封裝好的指令
        const fullText = `請擔任奧修禪卡專家，嚴格遵守原則：1.全程繁體中文 2.聚焦內在覺察不預測未來 3.結合官方79張牌義與圖像象徵 4.語氣溫柔直接有禪意不說教 5.直接進入解讀。\\n\\n問題：\${q}\\n牌：\${c}`;

        // 執行複製
        const el = document.createElement('textarea');
        el.value = fullText;
        document.body.appendChild(el);
        el.select();
        document.execCommand('copy');
        document.body.removeChild(el);

        alert("解讀指令已複製！請在跳轉後的頁面貼上對話框。");

        // 跳轉
        window.location.href = "https://gemini.google.com/app";
    }
</script>

</body>
</html>
