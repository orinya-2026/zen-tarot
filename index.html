<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>奧修禪卡解讀器</title>
    <style>
        :root {
            --zen-bg: #fdfaf5;
            --zen-dark: #4a4a4a;
            --zen-accent: #9a8c73;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--zen-bg);
            color: var(--zen-dark);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .app-container {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        h2 {
            text-align: center;
            font-weight: 300;
            letter-spacing: 2px;
            color: var(--zen-accent);
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #888;
        }
        textarea, input {
            width: 100%;
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 12px;
            box-sizing: border-box;
            font-size: 1rem;
            background: #fafafa;
        }
        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background-color: var(--zen-accent);
            color: white;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        button:active {
            opacity: 0.7;
        }
        .hint {
            font-size: 0.8rem;
            color: #aaa;
            margin-top: 5px;
        }
        /* PWA 模擬樣式 */
        @media (display-mode: standalone) {
            body { padding-top: 50px; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <h2>禪 · 覺察</h2>
    
    <div class="input-group">
        <label>你的問題</label>
        <textarea id="question" rows="3" placeholder="例如：我當下的內在狀態？"></textarea>
    </div>

    <div class="input-group">
        <label>抽到的牌卡 (1-5張，用逗號分隔)</label>
        <input type="text" id="cards" placeholder="例如：Silence, 蛻變 正位">
        <div class="hint">支援中英文、正逆位</div>
    </div>

    <button onclick="sendToAI()">開始解讀</button>
</div>

<script>
    <script>
    function sendToAI() {
        const question = document.getElementById('question').value;
        const cards = document.getElementById('cards').value;
        
        if(!question || !cards) {
            alert("請填寫問題與牌卡");
            return;
        }

        // 這裡封裝了你所有的解讀原則，確保每次跳轉後 Gemini 都會遵守
        const prompt = `請啟動奧修禪卡專家模式，嚴格遵守以下原則：
1. 全程繁體中文。
2. 聚焦內在覺察，不預測未來。
3. 結合官方79張牌義與圖像象徵。
4. 語氣溫柔直接，有禪意不說教。
5. 直接解讀，不需解釋流程。

問題：${question} 
牌：${cards}`;
        
        // 使用 google.com/search 的特殊參數，這能更穩定地將文字帶入 Gemini 介面
        const encodedMsg = encodeURIComponent(prompt);
        window.location.href = `https://www.google.com/search?q=${encodedMsg}&btnI=I`;
        
        // 如果上述方式在部分手機失效，可嘗試備用方案：
        // window.location.href = `https://gemini.google.com/app?q=${encodedMsg}`;
    }
</script>
