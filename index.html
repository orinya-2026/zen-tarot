<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>奧修禪卡 · 覺察</title>
    <style>
        :root {
            --zen-bg: #fdfaf5;
            --zen-dark: #333333;
            --zen-accent: #8e7d5f;
            --zen-input: #ffffff;
        }
        body {
            font-family: -apple-system, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
            background-color: var(--zen-bg);
            color: var(--zen-dark);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        .app-container {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 30px 20px;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.03);
            height: fit-content;
            margin-top: 40px;
        }
        h2 {
            text-align: center;
            font-weight: 300;
            letter-spacing: 4px;
            color: var(--zen-accent);
            margin-bottom: 30px;
        }
        .input-group {
            margin-bottom: 25px;
        }
        label {
            display: block;
            margin-bottom: 10px;
            font-size: 0.85rem;
            color: #999;
            letter-spacing: 1px;
        }
        textarea, input {
            width: 100%;
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 15px;
            box-sizing: border-box;
            font-size: 1rem;
            background: #fafafa;
            transition: all 0.3s;
            outline: none;
        }
        textarea:focus, input:focus {
            border-color: var(--zen-accent);
            background: white;
        }
        button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background-color: var(--zen-accent);
            color: white;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            margin-top: 10px;
        }
        button:active {
            transform: scale(0.98);
            opacity: 0.9;
        }
        .footer-note {
            text-align: center;
            font-size: 0.75rem;
            color: #ccc;
            margin-top: 30px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="app-container">
    <h2>禪 · 覺察</h2>
    
    <div class="input-group">
        <label>內心的提問</label>
        <textarea id="question" rows="3" placeholder="請輸入你想探索的問題..."></textarea>
    </div>

    <div class="input-group">
        <label>抽到的牌卡 (1-5張)</label>
        <input type="text" id="cards" placeholder="如：空, 轉向內在 正位">
    </div>

    <button onclick="sendToAI()">開啟解讀</button>

    <div class="footer-note">
        點擊後將連結至 Gemini 進行深度解讀<br>
        建議在手機瀏覽器點選「加入主畫面」使用
    </div>
</div>

<script>
    function sendToAI() {
        const q = document.getElementById('question').value.trim();
        const c = document.getElementById('cards').value.trim();
        
        if(!q || !c) {
            alert("請完整填寫問題與牌卡名稱。");
            return;
        }

        // 這是預設給 AI 的指令內容
        const systemRules = "請擔任奧修禪卡專家，嚴格遵守原則：1.全程繁體中文 2.聚焦內在覺察不預測未來 3.結合官方79張牌義與圖像象徵 4.語氣溫柔直接有禪意不說教 5.直接解讀。";
        
        const finalMessage = `\${systemRules}\\n\\n問題：\${q}\\n牌卡：\${c}`;
        
        // 這是最重要的跳轉網址，使用 Gemini 官方 App 入口
        const encodedMsg = encodeURIComponent(finalMessage);
        window.location.href = `https://gemini.google.com/app?q=\${encodedMsg}`;
    }
</script>

</body>
</html>
